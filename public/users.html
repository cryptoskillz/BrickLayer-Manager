<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Bricklayer Manager</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-900 font-sans">
    <main class="flex-grow flex flex-col w-full h-full">
        <div class="min-h-screen bg-gray-50 flex flex-col" x-data="userManager()">
    <!-- Top Navigation -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md mr-3">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">Bricklayer <span class="font-normal text-gray-500">Manager</span></h1>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Dashboard</a>
                    <a href="/finance.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Finance</a>
                    <a href="/users.html" class="text-sm font-medium text-gray-900 transition-colors">Users</a>
                    <a href="/settings.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Settings</a>
                    <button @click="logout" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">User Management</h2>
                <p class="mt-1 text-sm text-gray-500">Manage users and permissions for the manager.</p>
            </div>
            <button @click="openModal()" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Add User
            </button>
        </div>

        <!-- Error State -->
        <div x-show="error" class="rounded-xl bg-red-50 p-4 mb-6 border border-red-100" x-cloak>
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-red-800" x-text="error"></p>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white shadow-sm border border-gray-200 rounded-2xl overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                        <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <template x-for="user in users" :key="user.email">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" x-text="user.email"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium capitalize"
                                      :class="{
                                        'bg-blue-100 text-blue-800': user.role === 'admin',
                                        'bg-green-100 text-green-800': user.role === 'editor',
                                        'bg-gray-100 text-gray-800': user.role === 'viewer'
                                      }" x-text="user.role"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDate(user.created_at)"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                                <button @click="openModal(user)" class="text-blue-600 hover:text-blue-900" title="Edit User">Edit</button>
                                <button @click="deleteUser(user.email)" class="text-red-600 hover:text-red-900" title="Delete User">Delete</button>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="users.length === 0">
                        <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">No users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit User Modal -->
    <div x-show="isModalOpen" class="fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true" x-cloak>
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isModalOpen" @click="closeModal()" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div x-show="isModalOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="relative inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form @submit.prevent="saveUser">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title" x-text="isEditing ? 'Edit User' : 'Add User'"></h3>
                        
                        <div class="space-y-4">
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                                <input type="email" id="email" x-model="form.email" :disabled="isEditing" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm disabled:bg-gray-100 disabled:text-gray-500">
                            </div>
                            
                            <div>
                                <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
                                <select id="role" x-model="form.role" class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                    <option value="admin">Admin</option>
                                    <option value="editor">Editor</option>
                                    <option value="viewer">Viewer</option>
                                </select>
                            </div>

                            <div class="pt-2 border-t border-gray-100 mt-4">
                                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                                <div class="relative mt-1">
                                    <input :type="showPassword ? 'text' : 'password'" id="password" x-model="form.password" class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                    <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                                        <svg x-show="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                        <svg x-show="showPassword" x-cloak class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                                    </button>
                                </div>
                                <p class="text-xs text-gray-500 mt-1" x-show="!isEditing">Leave blank to send an invite email so the user can set their own password.</p>
                                <p class="text-xs text-gray-500 mt-1" x-show="isEditing" x-cloak>Leave blank to keep the current password unchanged.</p>
                            </div>

                            <div>
                                <label for="confirm" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                                <div class="relative mt-1">
                                    <input :type="showPassword ? 'text' : 'password'" id="confirm" x-model="form.confirm" class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                </div>
                            </div>

                            <div x-show="modalError" x-text="modalError" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3" x-cloak></div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200">
                        <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                            Save User
                        </button>
                        <button type="button" @click="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    if (!localStorage.getItem('bricklayer_token')) {
        window.location.href = '/login';
    }

    document.addEventListener('alpine:init', () => {
        Alpine.data('userManager', () => ({
            users: [],
            error: null,
            modalError: null,
            isModalOpen: false,
            isEditing: false,
            showPassword: false,
            form: { email: '', password: '', confirm: '', role: 'viewer' },

            async init() {
                this.fetchUsers();
            },

            async fetchUsers() {
                const token = localStorage.getItem('bricklayer_token');
                try {
                    const res = await fetch('/api/users', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.status === 401 || res.status === 403) {
                        this.error = 'You do not have permission to view users.';
                        return;
                    }
                    const data = await res.json();
                    if (res.ok) {
                        this.users = data.users || [];
                    } else {
                        this.error = data.error || 'Failed to fetch users';
                    }
                } catch (e) {
                    this.error = 'Network error fetching users';
                }
            },

            async saveUser() {
                this.modalError = null;
                
                if (this.form.password && this.form.password !== this.form.confirm) {
                    this.modalError = "Passwords do not match.";
                    return;
                }

                if (this.form.password && this.form.password.length < 6) {
                    this.modalError = "Password must be at least 6 characters.";
                    return;
                }

                const token = localStorage.getItem('bricklayer_token');
                try {
                    const res = await fetch('/api/users', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: this.form.email,
                            password: this.form.password,
                            role: this.form.role
                        })
                    });
                    if (res.ok) {
                        this.fetchUsers();
                        this.closeModal();
                    } else {
                        const data = await res.json();
                        this.modalError = data.error || 'Failed to save user';
                    }
                } catch (e) {
                    this.modalError = 'Network error saving user';
                }
            },

            async deleteUser(email) {
                if (!confirm(`Are you sure you want to delete ${email}?`)) return;
                const token = localStorage.getItem('bricklayer_token');
                try {
                    const res = await fetch(`/api/users/${encodeURIComponent(email)}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        this.fetchUsers();
                    } else {
                        alert('Failed to delete user');
                    }
                } catch (e) {
                    alert('Network error deleting user');
                }
            },

            openModal(user = null) {
                this.modalError = null;
                this.showPassword = false;
                if (user) {
                    this.isEditing = true;
                    this.form = { email: user.email, password: '', confirm: '', role: user.role };
                } else {
                    this.isEditing = false;
                    this.form = { email: '', password: '', confirm: '', role: 'viewer' };
                }
                this.isModalOpen = true;
            },

            closeModal() {
                this.isModalOpen = false;
            },

            logout() {
                localStorage.removeItem('bricklayer_token');
                window.location.href = '/login';
            },

            formatDate(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(date);
            }
        }));
    });
</script>

    </main>
</body>
</html>
