<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Bricklayer Manager</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-900 font-sans">
    <main class="flex-grow flex flex-col w-full h-full">
        <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 sm:p-8" x-data="resetPassword()">
    <div class="max-w-md w-full bg-white border border-gray-200 rounded-2xl p-8 shadow-xl relative overflow-hidden">
        
        <div class="relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-green-500/30">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Set New Password</h2>
                <p class="text-sm text-gray-500 mt-2">Enter your new password below.</p>
            </div>

            <div x-show="success" class="text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg p-4 mb-6 text-center" x-cloak>
                <p class="mb-4">Your password has been successfully updated!</p>
                <a href="/login" class="inline-block py-2 px-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Go to Login</a>
            </div>

            <form @submit.prevent="submit" x-show="!success" class="space-y-6">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" placeholder="••••••••">
                        <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <svg x-show="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            <svg x-show="showPassword" x-cloak class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" id="confirm" x-model="confirm" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" placeholder="••••••••">
                    </div>
                </div>

                <div x-show="error" x-text="error" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3" x-cloak></div>

                <button type="submit" :disabled="loading" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium tracking-wide shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
                    <span x-show="!loading">Update Password</span>
                    <span x-show="loading" x-cloak>Saving...</span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('resetPassword', () => ({
            password: '',
            confirm: '',
            showPassword: false,
            error: null,
            success: false,
            loading: false,

            async submit() {
                this.error = null;
                
                if (this.password !== this.confirm) {
                    this.error = "Passwords do not match.";
                    return;
                }

                if (this.password.length < 6) {
                    this.error = "Password must be at least 6 characters.";
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                
                if (!token) {
                    this.error = "Invalid or missing token.";
                    return;
                }

                this.loading = true;

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password: this.password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        this.success = true;
                    } else {
                        this.error = data.error || 'Failed to reset password.';
                    }
                } catch (err) {
                    this.error = 'Network error. Please try again.';
                } finally {
                    this.loading = false;
                }
            }
        }));
    });
</script>

    </main>
</body>
</html>
