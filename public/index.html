<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Bricklayer Manager</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-900 font-sans">
    <main class="flex-grow flex flex-col w-full h-full">
        <div class="min-h-screen bg-gray-50 flex flex-col" x-data="dashboard()">
    <!-- Top Navigation -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md mr-3">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">Bricklayer <span class="font-normal text-gray-500">Manager</span></h1>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium text-gray-900 transition-colors">Dashboard</a>
                    <a href="/users.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Users</a>
                    <a href="/settings.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Settings</a>
                    <button @click="logout" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Connected Sites</h2>
                <p class="mt-1 text-sm text-gray-500">Manage all your statically generated JamBrick sites.</p>
            </div>
            <button @click="fetchSites" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                <svg class="w-4 h-4 mr-2" :class="{'animate-spin': loading}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh
            </button>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-20" x-cloak>
            <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500 font-medium">Loading your sites...</p>
        </div>

        <!-- Error State -->
        <div x-show="error" class="rounded-xl bg-red-50 p-4 mb-6 border border-red-100" x-cloak>
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800" x-text="error"></h3>
                </div>
            </div>
        </div>

        <!-- Sites Grid -->
        <div x-show="!loading && sites.length > 0" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" x-cloak>
            <template x-for="site in sites" :key="site.id">
                <div class="bg-white overflow-hidden shadow-sm border border-gray-200 rounded-2xl hover:shadow-lg transition-all duration-300 group flex flex-col h-full">
                    <div class="p-6 flex-1">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold text-gray-900 group-hover:text-blue-600 transition-colors" x-text="site.name || 'Unnamed Project'"></h3>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200">
                                Active
                            </span>
                        </div>
                        <p class="text-sm text-gray-500 mb-6" x-text="site.description || 'No description provided.'"></p>
                        
                        <dl class="grid grid-cols-1 gap-x-4 gap-y-4 sm:grid-cols-2">
                            <div class="sm:col-span-2">
                                <dt class="text-xs font-medium text-gray-500 uppercase tracking-wider">Preview URL</dt>
                                <dd class="mt-1 text-sm text-gray-900">
                                    <template x-if="site.url">
                                        <a :href="site.url" target="_blank" class="text-blue-600 hover:text-blue-500 hover:underline inline-flex items-center break-all">
                                            <span x-text="site.url"></span>
                                        </a>
                                    </template>
                                </dd>
                            </div>

                            <template x-if="site.productionUrl">
                                <div class="sm:col-span-2">
                                    <dt class="text-xs font-medium text-gray-500 uppercase tracking-wider">Production URL</dt>
                                    <dd class="mt-1 text-sm text-gray-900">
                                        <a :href="site.productionUrl" target="_blank" class="text-green-600 hover:text-green-500 hover:underline inline-flex items-center break-all">
                                            <span x-text="site.productionUrl"></span>
                                        </a>
                                    </dd>
                                </div>
                            </template>

                            <template x-if="site.githubUrl">
                                <div class="sm:col-span-2">
                                    <dt class="text-xs font-medium text-gray-500 uppercase tracking-wider">Repository</dt>
                                    <dd class="mt-1 text-sm text-gray-900">
                                        <a :href="site.githubUrl" target="_blank" class="text-gray-700 hover:text-black inline-flex items-center break-all">
                                            <svg class="w-4 h-4 mr-1.5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                                            <span x-text="site.githubUrl.split('github.com/')[1] || site.githubUrl"></span>
                                        </a>
                                    </dd>
                                </div>
                            </template>

                            <div class="sm:col-span-2 bg-gray-50 p-3 rounded-lg border border-gray-100 mt-2">
                                <h4 class="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Costs</h4>
                                <div class="grid grid-cols-3 gap-2 text-center">
                                    <div>
                                        <span class="block text-xs text-gray-500">Build</span>
                                        <span class="font-medium text-sm text-gray-900" x-text="formatCurrency(site.buildingCost)"></span>
                                    </div>
                                    <div>
                                        <span class="block text-xs text-gray-500">Host/mo</span>
                                        <span class="font-medium text-sm text-gray-900" x-text="formatCurrency(site.hostingCost)"></span>
                                    </div>
                                    <div>
                                        <span class="block text-xs text-gray-500">License/mo</span>
                                        <span class="font-medium text-sm text-gray-900" x-text="formatCurrency(site.licenseCost)"></span>
                                    </div>
                                </div>
                            </div>
                        </dl>
                    </div>
                    <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 flex justify-between items-center">
                        <button @click="openEditModal(site)" class="text-sm font-medium text-blue-600 hover:text-blue-500 flex items-center" title="Edit Site">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            Edit
                        </button>
                        <button @click="deleteSite(site)" class="text-sm font-medium text-red-600 hover:text-red-500 flex items-center" title="Delete Site">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Delete
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="!loading && sites.length === 0 && !error" class="text-center py-24 bg-white border-2 border-dashed border-gray-200 rounded-2xl" x-cloak>
            <div class="mx-auto w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h3 class="mt-2 text-lg font-medium text-gray-900">No sites connected yet</h3>
            <p class="mt-1 text-sm text-gray-500 max-w-sm mx-auto">
                Get started by running <code class="bg-gray-100 text-gray-800 px-1.5 py-0.5 rounded text-xs">bricklayer manage</code> in any of your BaseBrick projects.
            </p>
        </div>
    </main>

    <!-- Edit Site Modal -->
    <div x-show="isEditModalOpen" class="fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true" x-cloak>
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isEditModalOpen" @click="closeEditModal()" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div x-show="isEditModalOpen" class="relative inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form @submit.prevent="saveSite">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title">Edit Site</h3>
                        
                        <div class="space-y-4">
                            <div>
                                <label for="productionUrl" class="block text-sm font-medium text-gray-700">Production URL</label>
                                <input type="url" id="productionUrl" x-model="editForm.productionUrl" placeholder="https://..." class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            </div>
                            
                            <div class="grid grid-cols-3 gap-4">
                                <div>
                                    <label for="buildingCost" class="block text-sm font-medium text-gray-700">Build Cost</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span class="text-gray-500 sm:text-sm">$</span></div>
                                        <input type="number" step="0.01" id="buildingCost" x-model="editForm.buildingCost" class="pl-7 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label for="hostingCost" class="block text-sm font-medium text-gray-700">Hosting/mo</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span class="text-gray-500 sm:text-sm">$</span></div>
                                        <input type="number" step="0.01" id="hostingCost" x-model="editForm.hostingCost" class="pl-7 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label for="licenseCost" class="block text-sm font-medium text-gray-700">License/mo</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span class="text-gray-500 sm:text-sm">$</span></div>
                                        <input type="number" step="0.01" id="licenseCost" x-model="editForm.licenseCost" class="pl-7 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200">
                        <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                            Save Changes
                        </button>
                        <button type="button" @click="closeEditModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    if (!localStorage.getItem('bricklayer_token')) {
        window.location.href = '/login';
    }

    document.addEventListener('alpine:init', () => {
        Alpine.data('dashboard', () => ({
            sites: [],
            loading: true,
            error: null,
            isEditModalOpen: false,
            editForm: { id: '', productionUrl: '', buildingCost: 0, hostingCost: 0, licenseCost: 0 },

            async init() {
                await this.fetchSites();
                setInterval(() => {
                    if(!this.isEditModalOpen) this.fetchSites(true);
                }, 10000);
            },

            async fetchSites(silent = false) {
                if (!silent) this.loading = true;
                this.error = null;
                const token = localStorage.getItem('bricklayer_token');

                try {
                    const response = await fetch('/api/sites', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.status === 401) {
                        this.logout();
                        return;
                    }

                    const data = await response.json();
                    if (response.ok) {
                        this.sites = data.sites || [];
                    } else {
                        this.error = data.error || 'Failed to load sites';
                    }
                } catch (err) {
                    this.error = 'Network error. Could not connect to API.';
                } finally {
                    this.loading = false;
                }
            },

            openEditModal(site) {
                this.editForm = { 
                    id: site.id, 
                    productionUrl: site.productionUrl || '', 
                    buildingCost: site.buildingCost || 0,
                    hostingCost: site.hostingCost || 0,
                    licenseCost: site.licenseCost || 0
                };
                this.isEditModalOpen = true;
            },

            closeEditModal() {
                this.isEditModalOpen = false;
            },

            async saveSite() {
                const token = localStorage.getItem('bricklayer_token');
                try {
                    const res = await fetch(`/api/sites/${encodeURIComponent(this.editForm.id)}`, {
                        method: 'PUT',
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            productionUrl: this.editForm.productionUrl,
                            buildingCost: this.editForm.buildingCost,
                            hostingCost: this.editForm.hostingCost,
                            licenseCost: this.editForm.licenseCost
                        })
                    });
                    if (res.ok) {
                        this.fetchSites();
                        this.closeEditModal();
                    } else {
                        alert('Failed to update site');
                    }
                } catch (e) {
                    alert('Network error updating site');
                }
            },

            async deleteSite(site) {
                if (!confirm(`Are you sure you want to delete ${site.name || 'this site'}?`)) return;

                const token = localStorage.getItem('bricklayer_token');
                try {
                    const response = await fetch(`/api/sites/${encodeURIComponent(site.id)}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        this.sites = this.sites.filter(s => s.id !== site.id);
                    } else {
                        alert('Failed to delete site.');
                    }
                } catch (err) {
                    alert('Network error. Could not delete site.');
                }
            },

            logout() {
                localStorage.removeItem('bricklayer_token');
                window.location.href = '/login';
            },

            formatDate(dateString) {
                if (!dateString) return 'Never';
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-US', { 
                    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                }).format(date);
            },

            formatCurrency(val) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val || 0);
            }
        }));
    });
</script>

    </main>
</body>
</html>
